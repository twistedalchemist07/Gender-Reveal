<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A little one is on the way</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <!-- <h1 class="title">🎉 A little one is on the way 🎉</h1> -->
    <h1 class="title">A little one is on the way!</h1>

    <div id="timer"></div>
    <!-- Add in <head> -->

    <!-- Reveal button now directly below timer -->
    <button id="revealBtn" disabled>Reveal</button>

    <!-- New instruction text -->
    <p id="voteHint">Cast your vote before the big day!</p>

    <div class="buttons">
      <button class="vote-btn" onclick="vote('boy')">Vote 💙 Boy</button>
      <button class="vote-btn" onclick="vote('girl')">Vote 💖 Girl</button>
    </div>

    <canvas id="voteChart" width="200" height="200"></canvas>
    <h2 id="revealText"></h2>
  </div>

  <div id="balloon-container"></div>

  <canvas id="fireworks"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
